name: Channel Diagnostic & Audit

on:
  workflow_dispatch:

jobs:
  audit-channel:
    name: "Audit YouTube Channel Performance & Algorithm Health"
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run Channel Diagnostic
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          YT_CLIENT_ID: ${{ secrets.YT_CLIENT_ID }}
          YT_CLIENT_SECRET_VALUE: ${{ secrets.YT_CLIENT_SECRET_VALUE }}
          YT_REFRESH_TOKEN: ${{ secrets.YT_REFRESH_TOKEN }}
        run: |
          python diagnose_channel.py

      - name: Upload Diagnostic Report Artifact
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: channel-diagnosis-report
          path: data/output/channel_diagnosis_report.md
